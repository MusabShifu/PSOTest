<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e0e0e6;
            border-top-color: #4a6cf7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { color: #1a1a2e; margin: 0 0 10px; }
        p { color: #5a5a7a; margin: 5px 0; }
        .id-display {
            background: #f4f4f9;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 15px 0 10px;
            word-break: break-all;
        }
        .error { color: #e53e3e; margin-top: 15px; }
        .small { font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="spinner" id="spinner"></div>
        <h2>📋 Redirecting...</h2>
        <p>Detecting your Telegram ID</p>
        <div id="idDisplay" class="id-display">—</div>
        <div id="statusMsg" class="small">Please wait...</div>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        (function() {
            // --- Your Google Form URL with placeholder ---
            const BASE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdzwTE-PcIOa0AvbtdTtvitwujLpI4rcvrOIYXuh0iLBujYjw/viewform?usp=pp_url&entry.966732168=xxxxxxx";

            const idDisplay = document.getElementById('idDisplay');
            const spinner = document.getElementById('spinner');
            const statusMsg = document.getElementById('statusMsg');
            const errorMsg = document.getElementById('errorMsg');

            let userId = null;

            // --- Step 1: Try Telegram Web App (Mini App) ---
            if (window.Telegram && window.Telegram.WebApp) {
                const webApp = window.Telegram.WebApp;
                const user = webApp.initDataUnsafe?.user;
                if (user && user.id) {
                    userId = user.id;
                }
                webApp.expand(); // Make it full screen
                webApp.ready();
            }

            // --- Step 2: Fallback to URL parameter (e.g., ?tg_id=123) ---
            if (!userId) {
                const params = new URLSearchParams(window.location.search);
                const idParam = params.get('tg_id') || params.get('id');
                if (idParam && /^\d+$/.test(idParam)) {
                    userId = idParam;
                }
            }

            // --- Step 3: Auto-redirect or show error ---
            if (userId) {
                idDisplay.textContent = `✅ ${userId}`;
                statusMsg.textContent = `Redirecting to membership form...`;

                // Build the final URL
                const finalUrl = BASE_URL.replace('xxxxxxx', userId);

                // Redirect after a tiny delay (so user sees the ID was detected)
                setTimeout(function() {
                    window.location.href = finalUrl;
                }, 800); // 0.8 second delay (you can reduce to 200ms if you want)

            } else {
                // No ID found — show error
                spinner.style.display = 'none';
                errorMsg.textContent = '❌ Could not detect your Telegram ID. Please open this page directly from the Telegram bot.';
                idDisplay.textContent = '⚠️ Not detected';
                statusMsg.textContent = 'Try using the /start command in the bot again.';
            }
        })();
    </script>
</body>
</html>
