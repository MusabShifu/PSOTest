<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>استمارة تجديد العضوية | إرسال إلى تليجرام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h1>📋 استمارة تجديد العضوية</h1>
            <p>جميع الحقول مطلوبة | رفع السيرة الذاتية (PDF أو صورة)</p>
        </div>
        <div class="form-body">
            <form id="membershipForm" enctype="multipart/form-data">
                <!-- 1. الاسم رباعي -->
                <div class="field-group">
                    <label>الاسم رباعي <span class="required-star">*</span></label>
                    <input type="text" id="fullName" required>
                </div>

                <!-- 2. رقم الهاتف -->
                <div class="field-group">
                    <label>رقم الهاتف <span class="required-star">*</span></label>
                    <input type="tel" id="phone" required>
                </div>

                <!-- 3. الوظيفة (إن وجدت) -->
                <div class="field-group">
                    <label>الوظيفة (إن وجدت) <span class="required-star">*</span></label>
                    <input type="text" id="job" required>
                </div>

                <!-- 4. المنصب (المكتب / اللجنة) -->
                <div class="field-group">
                    <label>المنصب (المكتب / اللجنة) <span class="required-star">*</span></label>
                    <input type="text" id="position" required>
                </div>

                <!-- 5. السكن -->
                <div class="field-group">
                    <label>السكن <span class="required-star">*</span></label>
                    <input type="text" id="residence" required>
                </div>

                <!-- 6. الجامعة -->
                <div class="field-group">
                    <label>الجامعة <span class="required-star">*</span></label>
                    <input type="text" id="university" required>
                </div>

                <!-- 7. التخصص -->
                <div class="field-group">
                    <label>التخصص <span class="required-star">*</span></label>
                    <input type="text" id="major" required>
                </div>

                <!-- 8. المستوى -->
                <div class="field-group">
                    <label>المستوى <span class="required-star">*</span></label>
                    <input type="text" id="level" required>
                </div>

                <!-- 9. رقم الواتس -->
                <div class="field-group">
                    <label>رقم الواتس <span class="required-star">*</span></label>
                    <input type="tel" id="whatsapp" required>
                </div>

                <!-- 10. معرف التليجرام -->
                <div class="field-group">
                    <label>معرف التليجرام أو رقم الحساب <span class="required-star">*</span></label>
                    <input type="text" id="telegramIdentifier" required>
                    <div class="hint-text">📱 أدخل @username أو رقم الهاتف المرتبط بتليجرام</div>
                </div>

                <!-- 11. الايميل -->
                <div class="field-group">
                    <label>البريد الإلكتروني <span class="required-star">*</span></label>
                    <input type="email" id="email" required>
                </div>

                <!-- 12. السيرة الذاتية (ملف) -->
                <div class="field-group">
                    <label>السيرة الذاتية (ملف PDF أو صورة) <span class="required-star">*</span></label>
                    <div class="file-area">
                        <input type="file" id="cvFile" accept=".pdf,image/jpeg,image/png,image/jpg,image/webp" required>
                        <div class="file-note">📄 صيغ مسموحة: PDF, JPEG, PNG, WEBP (الحد الأقصى 10 MB)</div>
                    </div>
                </div>

                <button type="submit" id="submitBtn">📨 إرسال الاستمارة إلى تليجرام</button>
                <div id="statusMessage" class="status-message"></div>
            </form>
            <div class="footer-note">
                سيتم إرسال جميع الحقول مع ملف السيرة الذاتية إلى مجموعة العضوية المخصصة.
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="renewal.js"></script>
</body>
</html>
